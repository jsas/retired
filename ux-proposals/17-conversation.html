<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>17 — Conversation</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .num { font-variant-numeric: tabular-nums; }
  @keyframes rise { from { opacity:0; transform:translateY(10px) scale(.985); } to { opacity:1; transform:none; } }
  .msg { animation: rise .38s cubic-bezier(.2,.7,.3,1) both; }
  .chip { transition: transform .15s, background .15s, box-shadow .15s; }
  .chip:hover { transform: translateY(-1px); }
  .stepper-btn { transition: background .15s; }
  .stepper-btn:hover { background:#f1f0ec; }
  .stepper-btn:active { background:#e7e5e0; }
</style>
</head>
<body class="bg-[#faf7f2] text-stone-900 min-h-screen flex flex-col">

<!-- ═══ chrome ═══ -->
<header class="flex items-center gap-2.5 px-5 py-3 border-b border-stone-200/80">
  <div class="w-6 h-6 bg-blue-600 rounded flex items-center justify-center text-[11px] font-bold text-white">RE:</div>
  <span class="font-semibold text-sm tracking-tight">tired</span>
  <span class="text-xs text-stone-500 ml-1.5">17 · Conversation</span>
</header>

<main class="flex-1 w-full max-w-lg mx-auto px-4 py-7 pb-32">
  <div id="thread" class="space-y-4"></div>
  <div id="reply" class="mt-5"></div>
</main>

<footer class="px-5 py-3 text-[11px] text-stone-400">
  17 · Conversation — four questions, one answer: your plan as a chat you can poke at.
</footer>

<script src="model.js"></script>
<script>
  const state = { ...DEMO_DEFAULTS };
  const $ = id => document.getElementById(id);
  const thread = $('thread'), reply = $('reply');

  const AVATAR = '<div class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center text-[10px] font-bold text-white shrink-0">RE</div>';

  function scrollSoon() {
    requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }));
  }

  function bubble(html, who) {
    const me = who === 'me';
    const row = document.createElement('div');
    row.className = 'msg flex gap-2.5 ' + (me ? 'justify-end' : '');
    row.innerHTML = me
      ? '<div class="max-w-[80%] bg-blue-600 text-white text-[14.5px] leading-relaxed rounded-2xl rounded-br-md px-4 py-2.5">' + html + '</div>'
      : AVATAR + '<div class="max-w-[82%] bg-white text-[14.5px] leading-relaxed rounded-2xl rounded-bl-md px-4 py-2.5 shadow-sm border border-stone-200/80 text-stone-800">' + html + '</div>';
    thread.appendChild(row);
    scrollSoon();
    return row;
  }

  // inline answer widget that lives inside the thread: a stepper plus quick-jump chips
  function askOne(q) {
    bubble(q.text);

    const box = document.createElement('div');
    box.className = 'msg flex gap-2.5 pl-9';
    const card = document.createElement('div');
    card.className = 'bg-white rounded-2xl rounded-bl-md px-4 py-3.5 shadow-sm border border-stone-200/80 w-full max-w-[300px]';

    // value row
    const row = document.createElement('div');
    row.className = 'flex items-center gap-2.5';
    const dec = document.createElement('button');
    const val = document.createElement('div');
    const inc = document.createElement('button');
    dec.className = 'stepper-btn w-10 h-10 shrink-0 rounded-full bg-stone-100 border border-stone-300 text-stone-700 text-xl font-bold leading-none';
    inc.className = 'stepper-btn w-10 h-10 shrink-0 rounded-full bg-stone-100 border border-stone-300 text-stone-700 text-xl font-bold leading-none';
    dec.textContent = '−'; inc.textContent = '+';
    dec.setAttribute('aria-label', 'decrease');
    inc.setAttribute('aria-label', 'increase');
    val.className = 'num flex-1 text-center text-[26px] leading-none font-bold text-stone-900';
    val.textContent = q.fmt(state[q.key]);
    row.appendChild(dec); row.appendChild(val); row.appendChild(inc);
    card.appendChild(row);

    // quick-jump chips
    if (q.chips && q.chips.length) {
      const chips = document.createElement('div');
      chips.className = 'flex flex-wrap gap-1.5 justify-center mt-3';
      q.chips.forEach(c => {
        const b = document.createElement('button');
        b.className = 'chip text-[11px] px-2.5 py-1 rounded-full bg-stone-100 border border-stone-200 text-stone-600 hover:bg-stone-200';
        b.textContent = c.label;
        b.addEventListener('click', () => set(state[q.key] + c.delta));
        chips.appendChild(b);
      });
      card.appendChild(chips);
    }

    function set(v) { state[q.key] = q.clamp(v); val.textContent = q.fmt(state[q.key]); }
    dec.addEventListener('click', () => set(state[q.key] - q.step));
    inc.addEventListener('click', () => set(state[q.key] + q.step));

    // the "next" button
    const send = document.createElement('button');
    send.className = 'mt-3 w-full py-2.5 bg-stone-900 text-white text-[13px] font-semibold rounded-xl hover:bg-stone-800 transition-colors';
    send.textContent = q.last ? 'Show me my answer →' : 'Next →';
    send.addEventListener('click', () => {
      bubble(q.answer(state[q.key]), 'me');
      box.remove();
      if (q.next) askOne(q.next); else giveVerdict();
    });
    card.appendChild(send);

    box.appendChild(card);
    reply.appendChild(box);
    scrollSoon();
  }

  const Q_AGE = {
    key: 'currentAge', step: 1, clamp: v => Math.min(80, Math.max(40, v)),
    fmt: v => String(v),
    text: 'To start — how old are you now?',
    answer: v => 'I\'m <strong class="num">' + v + '</strong>.',
    chips: [{ label: '±1', delta: 1 }, { label: '±5', delta: 5 }, { label: '±10', delta: 10 }],
  };
  const Q_SAVE = {
    key: 'savings', step: 10000, clamp: v => Math.min(3000000, Math.max(0, v)),
    fmt: v => fmtMoney(v),
    text: 'And roughly how much have you saved all together?',
    answer: v => 'I\'ve saved <strong class="num">' + fmtMoney(v) + '</strong>.',
    chips: [{ label: '+$10k', delta: 10000 }, { label: '+$50k', delta: 50000 }, { label: '+$100k', delta: 100000 }],
  };
  const Q_RETIRE = {
    key: 'retireAge', step: 1, clamp: v => Math.min(80, Math.max(45, v)),
    fmt: v => String(v),
    text: 'When would you like to stop working?',
    answer: v => 'I\'d stop at <strong class="num">' + v + '</strong>.',
    chips: [{ label: '±1', delta: 1 }, { label: '±5', delta: 5 }],
  };
  const Q_SPEND = {
    key: 'spending', step: 5000, clamp: v => Math.min(250000, Math.max(20000, v)),
    fmt: v => fmtMoney(v),
    last: true,
    text: 'And how much would you like to spend each year after that?',
    answer: v => 'I\'d spend <strong class="num">' + fmtMoney(v) + '</strong> a year.',
    chips: [{ label: '−$5k', delta: -5000 }, { label: '+$5k', delta: 5000 }, { label: '+$10k', delta: 10000 }],
  };
  Q_AGE.next = Q_SAVE; Q_SAVE.next = Q_RETIRE; Q_RETIRE.next = Q_SPEND;

  function giveVerdict() {
    const res = simulate(state);
    const good = res.ok;
    bubble(good
      ? 'Good news. On those numbers your money lasts until you\'re <strong class="num text-emerald-700">'
        + lastsLabel(res) + '</strong>'
        + (res.leftAtMax > 25000
          ? ' — with about <span class="num">' + fmtMoney(res.leftAtMax) + '</span> still there at ' + state.maxAge + '.'
          : ' — past the ' + state.maxAge + ' you\'re planning for.')
      : 'Here\'s the honest part: it runs out when you\'re <strong class="num text-rose-700">'
        + res.depletionAge + '</strong> — ' + (state.maxAge - res.depletionAge) + ' year'
        + (state.maxAge - res.depletionAge === 1 ? '' : 's') + ' short of ' + state.maxAge + '.');

    if (!good && suggest(state)) {
      const s = suggest(state);
      bubble('One thought: ' + s.charAt(0).toLowerCase() + s.slice(1));
    }

    // inline mini chart of the balance over time
    const rows = res.rows;
    const X0 = 8, X1 = 332, Y0 = 8, Y1 = 76, AGE_MAX = 110;
    const peak = Math.max(1, ...rows.map(r => r.bal));
    const cx = a => X0 + (a - state.currentAge) / (AGE_MAX - state.currentAge) * (X1 - X0);
    const cy = v => Y0 + (1 - v / peak) * (Y1 - Y0);
    const pts = rows.map(r => cx(r.age).toFixed(1) + ',' + cy(r.bal).toFixed(1)).join(' ');
    const dryX = res.depletionAge != null ? cx(res.depletionAge).toFixed(1) : null;
    bubble(
      '<svg viewBox="0 0 340 96" class="w-full mt-1 block" aria-hidden="true">'
      + '<line x1="8" y1="76" x2="332" y2="76" stroke="#e7e2d8" stroke-width="1"/>'
      + '<polyline points="' + pts + '" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'
      + (dryX ? '<line x1="' + dryX + '" y1="8" x2="' + dryX + '" y2="76" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="3 3"/>' : '')
      + '<text x="8" y="90" font-size="9" fill="#a8a29e" class="num">' + state.currentAge + '</text>'
      + '<text x="' + (dryX || X1) + '" y="90" font-size="9" fill="#a8a29e" text-anchor="' + (dryX ? 'middle' : 'end') + '" class="num">'
        + (res.depletionAge != null ? res.depletionAge : '110+') + '</text>'
      + '</svg>'
    );

    setTimeout(followUps, 450);
  }

  function followUps() {
    bubble('Want to poke at it?');
    const chips = document.createElement('div');
    chips.className = 'msg flex gap-2.5 pl-9 flex-wrap';
    chips.innerHTML =
      '<button id="cStorm" class="chip px-3.5 py-2 text-[13px] rounded-full bg-white border border-stone-300 text-stone-700 shadow-sm hover:bg-stone-50">What if markets turn stormy?</button>'
      + '<button id="cRetire" class="chip px-3.5 py-2 text-[13px] rounded-full bg-white border border-stone-300 text-stone-700 shadow-sm hover:bg-stone-50">What if I retire at a different age?</button>';
    reply.appendChild(chips);
    scrollSoon();

    $('cStorm').addEventListener('click', () => {
      chips.remove();
      state.sky = 'storm';
      bubble('Okay — what if markets turn stormy?', 'me');
      const r2 = simulate(state);
      bubble(r2.ok
        ? 'Still standing: your money lasts until you\'re <strong class="num text-emerald-700">' + lastsLabel(r2) + '</strong>.'
        : 'That one hurts: it runs out when you\'re <strong class="num text-rose-700">' + r2.depletionAge + '</strong>. '
          + (suggest(state) ? suggest(state) : ''));
    });

    $('cRetire').addEventListener('click', () => {
      chips.remove();
      bubble('Sure — how much should I move it?', 'bot');
      const chooser = document.createElement('div');
      chooser.className = 'msg flex gap-2.5 pl-9';
      chooser.innerHTML =
        '<div class="bg-white rounded-2xl rounded-bl-md px-4 py-3 shadow-sm border border-stone-200/80">'
        + '<p class="text-[11px] uppercase tracking-wider text-stone-500 mb-2">retire at <span id="retNow" class="num font-bold text-stone-800">' + state.retireAge + '</span></p>'
        + '<div class="flex flex-wrap gap-1.5">'
        + '<button data-d="-5" class="chip px-3 py-1.5 text-[12.5px] rounded-full bg-stone-100 border border-stone-200 text-stone-700 hover:bg-stone-200">−5 yrs</button>'
        + '<button data-d="-1" class="chip px-3 py-1.5 text-[12.5px] rounded-full bg-stone-100 border border-stone-200 text-stone-700 hover:bg-stone-200">−1 yr</button>'
        + '<button data-d="1"  class="chip px-3 py-1.5 text-[12.5px] rounded-full bg-stone-100 border border-stone-200 text-stone-700 hover:bg-stone-200">+1 yr</button>'
        + '<button data-d="5"  class="chip px-3 py-1.5 text-[12.5px] rounded-full bg-stone-100 border border-stone-200 text-stone-700 hover:bg-stone-200">+5 yrs</button>'
        + '</div></div>';
      reply.appendChild(chooser);
      scrollSoon();

      chooser.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => {
        const d = +b.dataset.d;
        state.retireAge = Math.min(80, Math.max(45, state.retireAge + d));
        chooser.querySelector('#retNow').textContent = state.retireAge;
        bubble((d > 0 ? 'Try retiring ' + d + ' year' + (d === 1 ? '' : 's') + ' later.'
                      : 'Try retiring ' + (-d) + ' year' + (d === -1 ? '' : 's') + ' earlier.'), 'me');
        const r3 = simulate(state);
        bubble(r3.ok
          ? 'Better: your money lasts until you\'re <strong class="num text-emerald-700">' + lastsLabel(r3) + '</strong>'
            + (r3.leftAtMax > 25000 ? ' — about <span class="num">' + fmtMoney(r3.leftAtMax) + '</span> left at ' + state.maxAge + '.' : '.')
          : 'Still short — it runs out at <strong class="num text-rose-700">' + r3.depletionAge + '</strong>. Try another age, or spend a little less.');
      }));

      // a way to stop tweaking
      const done = document.createElement('div');
      done.className = 'msg pl-9';
      done.innerHTML = '<button class="chip px-3.5 py-2 text-[13px] rounded-full bg-stone-900 text-white shadow-sm hover:bg-stone-800">Start over</button>';
      done.querySelector('button').addEventListener('click', () => location.reload());
      reply.appendChild(done);
    });
  }

  askOne(Q_AGE);
</script>
</body>
</html>
