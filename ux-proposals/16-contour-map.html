      <text id="youText" x="0" y="0" text-anchor="middle" font-size="16" font-weight="700" fill="#fdf6ec" class="num">you are here</text>

    <circle id="dotHalo" cx="448" cy="314" r="26" fill="#b45309" opacity=".13"/>

<!-- ═══ floating readout, the only chrome over the terrain ═══ -->
<aside class="fu absolute right-5 top-5 w-[290px] bg-white/85 backdrop-blur-md rounded-2xl border border-stone-300/60 shadow-lg shadow-stone-900/5 p-5">
  <p class="text-[10.5px] font-semibold uppercase tracking-[0.16em] text-stone-500 mb-2.5">Where you stand</p>
  <p id="verdict" class="text-[16px] leading-snug font-semibold text-stone-900"></p>
  <p id="verdictSub" class="mt-1.5 text-[12.5px] text-stone-600 leading-relaxed"></p>

  <div class="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-stone-200">
    <div>
      <p class="text-[10.5px] uppercase tracking-wider text-stone-500 mb-0.5">Money lasts to</p>
      <p id="rLasts" class="num text-xl font-bold text-stone-900">—</p>
    </div>
    <div>
      <p class="text-[10.5px] uppercase tracking-wider text-stone-500 mb-0.5">Left at 95</p>
      <p id="rLeft" class="num text-xl font-bold text-stone-900">—</p>
    </div>
  </div>

  <div class="mt-4 pt-3 border-t border-stone-200 flex items-center justify-between gap-2">
    <span class="text-[11.5px] text-stone-600">Markets</span>
    <span class="flex gap-1">
      <button data-sky="storm"  class="sky text-[11px] px-2 py-0.5 rounded border transition-all">stormy</button>
      <button data-sky="normal" class="sky text-[11px] px-2 py-0.5 rounded border transition-all">ordinary</button>
      <button data-sky="sun"    class="sky text-[11px] px-2 py-0.5 rounded border transition-all">kind</button>
    </span>
  </div>
  <p id="tip" class="mt-3 text-[12px] text-amber-800 font-medium leading-snug min-h-[16px]"></p>
</aside>

<footer class="px-5 py-3 text-[11px] text-stone-400">
  16 · Contour Map — quiet terrain you can drag: walk uphill until the ground holds you.
</footer>

<script src="model.js"></script>
<script>
  const state = { ...DEMO_DEFAULTS };
  const $ = id => document.getElementById(id);

  // ---- map ↔ state mapping (must match the pre-drawn paths) ----
  const VW = 1220, VH = 800, PL = 70, PR = 1150, PT = 55, PB = 745;
  const A0 = 55, A1 = 75, S0 = 160000, S1 = 40000;
  const xFor = age  => PL + (age - A0) / (A1 - A0) * (PR - PL);
  const yFor = spend => PT + (S0 - spend) / (S0 - S1) * (PB - PT);
  const ageForX = x => A0 + (x - PL) / (PR - PL) * (A1 - A0);
  const spendForY = y => S1 + (PB - y) / (PB - PT) * (S0 - S1);

  const pad = $('terrain');

  function toSvg(evt) {
    const pt = pad.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    const m = pad.getScreenCTM();
    return m ? pt.matrixTransform(m.inverse()) : null;
  }

  function apply(evt) {
    const p = toSvg(evt);
    if (!p) return;
    const age = Math.round(Math.min(A1, Math.max(A0, ageForX(p.x))));
    const spend = Math.round(Math.min(S0, Math.max(S1, spendForY(p.y))) / 1000) * 1000;
    state.retireAge = age;
    state.spending = spend;
    render();
  }

  let dragging = false;
  pad.addEventListener('pointerdown', e => { dragging = true; pad.classList.add('grabbing'); try { pad.setPointerCapture(e.pointerId); } catch (_) {} apply(e); });
  pad.addEventListener('pointermove', e => { if (dragging) apply(e); });
  pad.addEventListener('pointerup',   () => { dragging = false; pad.classList.remove('grabbing'); });
  pad.addEventListener('pointercancel', () => { dragging = false; pad.classList.remove('grabbing'); });

  function render() {
    const res = simulate(state);
    const dx = xFor(state.retireAge), dy = yFor(state.spending);

    // dot + halo
    $('dot').setAttribute('cx', dx);      $('dot').setAttribute('cy', dy);
    $('dotHalo').setAttribute('cx', dx);  $('dotHalo').setAttribute('cy', dy);

    // "you are here" pill, sitting above the dot (flipped below when near the top)
    const pillH = 36, labelPad = 16;
    $('youText').textContent = 'you are here · ' + fmtMoney(state.spending) + ' at ' + state.retireAge;
    // measure the label so the pill always fits its text
    const approxW = Math.round($('youText').textContent.length * 8.4) + labelPad * 2;
    const pillW = Math.max(150, Math.min(300, approxW));
    const above = dy > PT + 80;
    const px = Math.min(VW - pillW - 12, Math.max(12, dx - pillW / 2));
    const py = above ? dy - 62 : dy + 36;
    $('youPill').setAttribute('x', px); $('youPill').setAttribute('y', py);
    $('youPill').setAttribute('width', pillW);
    $('youPill').setAttribute('height', pillH);
    $('youText').setAttribute('x', px + pillW / 2);
    $('youText').setAttribute('y', py + pillH / 2 + 6);
    $('youStem').setAttribute('x1', dx); $('youStem').setAttribute('x2', dx);
    $('youStem').setAttribute('y1', above ? py + pillH : dy);
    $('youStem').setAttribute('y2', above ? dy - 16 : py);

    // verdict
    if (res.ok) {
      $('verdict').innerHTML = 'Your money lasts until you\'re <span class="num text-emerald-700">'
        + lastsLabel(res) + '</span> — this ground holds you.';
      $('verdictSub').textContent = res.leftAtMax > 25000
        ? 'About ' + fmtMoney(res.leftAtMax) + ' would still be there at ' + state.maxAge + '.'
        : 'It carries you just past ' + state.maxAge + ', the age you\'re planning for.';
      $('tip').textContent = '';
    } else {
      const gap = state.maxAge - res.depletionAge;
      $('verdict').innerHTML = 'Your money runs out at <span class="num text-rose-700">'
        + res.depletionAge + '</span> — ' + gap + ' year' + (gap === 1 ? '' : 's') + ' short.';
      $('verdictSub').textContent = 'Drag uphill: spend less, or keep working longer.';
      $('tip').textContent = suggest(state) ?? '';
    }

    $('rLasts').textContent = lastsLabel(res);
    $('rLeft').textContent = res.leftAtMax > 0 ? fmtMoney(res.leftAtMax) : 'nothing';

    document.querySelectorAll('.sky').forEach(b => {
      const on = b.dataset.sky === state.sky;
      b.className = 'sky text-[11px] px-2 py-0.5 rounded border transition-all ' + (on
        ? 'bg-stone-800 text-white border-stone-800'
        : 'border-stone-300 text-stone-600 hover:bg-stone-100');
    });
  }

  document.querySelectorAll('.sky').forEach(b =>
    b.addEventListener('click', () => { state.sky = b.dataset.sky; render(); }));

  render();
</script>
</body>
</html>
