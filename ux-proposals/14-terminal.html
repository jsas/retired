<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RE:tired — 14 · Terminal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="model.js"></script>
<style>
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
  }

  .num { font-variant-numeric: tabular-nums; }
  .line { white-space: pre-wrap; word-break: break-word; }

  .cursor {
    display: inline-block;
    width: 8px; height: 1.05em;
    background: #4ade80;
    vertical-align: text-bottom;
    animation: blink 1.05s steps(1, end) infinite;
  }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .prompt { color: #4ade80; opacity: .65; }
  .typed  { color: #e5e7eb; }
  .err    { color: #f87171; }
  .mut    { color: #6b7280; }
  .dim    { color: #4b5563; }
  .hi     { color: #4ade80; }
  .val    { color: #e5e7eb; }
  .warn   { color: #fbbf24; }

  input[type="text"] {
    background: transparent; border: none; outline: none;
    color: #e5e7eb; caret-color: #4ade80;
    font-family: inherit; font-size: inherit;
  }
  input[type="text"]::placeholder { color: #4b5563; }

  .hint {
    cursor: pointer;
    border: 1px solid #1f2937;
    padding: 1px 7px;
    color: #9ca3af;
    background: transparent;
    font-family: inherit;
    font-size: inherit;
    transition: color .12s ease, border-color .12s ease;
  }
  .hint:hover { color: #4ade80; border-color: #4ade80; }

  tr.gone td { color: #6b7280; }
  tr.gone td.bal { color: #7f1d1d; }
</style>
</head>
<body class="min-h-screen bg-[#0b0e11] px-4 py-6 text-[13px] leading-relaxed text-gray-300 antialiased sm:px-6 sm:py-8">

<div class="mx-auto max-w-3xl">

  <!-- top chrome -->
  <header class="mb-5 flex items-center gap-2.5">
    <div class="flex h-6 w-6 items-center justify-center rounded bg-blue-600 text-[9px] font-bold text-white">RE:</div>
    <span class="text-sm font-semibold tracking-tight text-gray-200">tired</span>
    <span class="text-[11px] text-gray-600">· 14 Terminal</span>
  </header>

  <div class="rounded border border-gray-800">

    <!-- output -->
    <div id="out" class="h-[440px] overflow-y-auto px-4 py-3 sm:px-5"></div>

    <!-- prompt -->
    <div class="flex items-center gap-2 border-t border-gray-800 px-4 py-3 sm:px-5">
      <span class="prompt">plan&gt;</span>
      <input id="in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
             class="num min-w-0 flex-1" placeholder="type a command" aria-label="Command input" />
      <span class="cursor" aria-hidden="true"></span>
    </div>
  </div>

  <!-- hints -->
  <div class="mt-4 flex flex-wrap items-center gap-2 text-[11.5px]">
    <span class="mut">try:</span>
    <button class="hint" data-cmd="help">help</button>
    <button class="hint" data-cmd="retire 64">retire 64</button>
    <button class="hint" data-cmd="spend 70k">spend 70k</button>
    <button class="hint" data-cmd="saved 1.2m">saved 1.2m</button>
    <button class="hint" data-cmd="markets stormy">markets stormy</button>
    <button class="hint" data-cmd="show">show</button>
  </div>

  <footer class="mt-6 text-[11.5px] text-gray-600">
    14 · Terminal — your plan, run as commands.
  </footer>
</div>

<script>
(function () {
  'use strict';

  var state = {
    currentAge: DEMO_DEFAULTS.currentAge,
    maxAge: DEMO_DEFAULTS.maxAge,
    retireAge: DEMO_DEFAULTS.retireAge,
    spending: DEMO_DEFAULTS.spending,
    savings: DEMO_DEFAULTS.savings,
    contrib: DEMO_DEFAULTS.contrib,
    benefits: DEMO_DEFAULTS.benefits,
    benefitAge: DEMO_DEFAULTS.benefitAge,
    sky: DEMO_DEFAULTS.sky
  };

  var TABLE_AGES = [60, 65, 70, 75, 80, 85, 90, 95];

  var out = document.getElementById('out');
  var input = document.getElementById('in');

  function money(v) { return '$' + Math.round(v).toLocaleString('en-CA'); }
  function yearWord(n) { return n === 1 ? 'year' : 'years'; }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function span(cls, text) {
    return '<span class="' + cls + '">' + esc(text) + '</span>';
  }
  function scrollToBottom() { out.scrollTop = out.scrollHeight; }

  function println(html, cls) {
    var div = document.createElement('div');
    div.className = 'line' + (cls ? ' ' + cls : '');
    div.innerHTML = html || '&nbsp;';
    out.appendChild(div);
    return div;
  }

  function blank() { println('&nbsp;'); }

  /* ---------- output blocks ---------- */

  function printBanner() {
    println(span('hi', 'RE:tired') + span('dim', ' · plan runner · type ') + span('mut', 'help') + span('dim', ' to begin'));
    blank();
  }

  function verdictLine(res, o) {
    var gap = o.maxAge - (res.depletionAge != null ? res.depletionAge : o.maxAge);
    var head;
    if (res.ok) {
      head = span('hi', 'VERDICT  ') + span('val', 'your money lasts until you’re ') +
        span('hi', lastsLabel(res)) + span('val', '.');
      head += span('dim', '  that’s past the ' + o.maxAge + ' you planned for, with ' +
        fmtMoney(res.leftAtMax) + ' still there.');
    } else {
      head = span('warn', 'VERDICT  ') + span('val', 'your money lasts until you’re ') +
        span('warn', lastsLabel(res)) + span('val', '.');
      head += span('dim', '  that’s ' + gap + ' ' + yearWord(gap) + ' short of ' + o.maxAge + '.');
    }
    return head;
  }

  function printTable(res, o) {
    var byAge = {};
    res.rows.forEach(function (r) { byAge[r.age] = r.bal; });

    println(span('mut', '  AGE   ' + 'SAVINGS'.padEnd(14) + 'STATUS'));
    println(span('dim', '  ' + '─'.repeat(36)));
    TABLE_AGES.forEach(function (a) {
      var gone = (res.depletionAge != null && a >= res.depletionAge);
      var bal = gone ? 0 : (byAge[a] != null ? byAge[a] : 0);
      var status = gone ? 'spent' : 'in the pot';
      var row = '  ' + String(a).padEnd(6) + money(bal).padEnd(14) + status;
      var tr = println(span('val', row));
      if (gone) tr.classList.add('gone');
    });
    blank();
    println(verdictLine(res, o));
    var s = suggest(o);
    if (!res.ok) {
      blank();
      println(span('dim', '  FIX     ') + span('hi', s || 'nothing small closes this gap'));
    }
  }

  function printState() {
    var w = { storm: 'stormy', normal: 'ordinary', sun: 'kind' };
    println(span('mut', '  your plan'));
    println('  ' + span('dim', 'age          ') + span('val', String(state.currentAge) + ' now, planning to ' + state.maxAge));
    println('  ' + span('dim', 'saved        ') + span('val', money(state.savings)));
    println('  ' + span('dim', 'adding       ') + span('val', money(state.contrib) + ' a year until you stop'));
    println('  ' + span('dim', 'stop working ') + span('val', 'at ' + state.retireAge));
    println('  ' + span('dim', 'spending     ') + span('val', money(state.spending) + ' a year after that'));
    println('  ' + span('dim', 'government   ') + span('val', money(state.benefits) + ' a year from ' + state.benefitAge));
    println('  ' + span('dim', 'markets      ') + span('val', w[state.sky]));
  }

  function printHelp() {
    println(span('mut', '  commands'));
    println('  ' + span('hi', 'retire 64') + span('dim', '        stop working at 64 (50–75)'));
    println('  ' + span('hi', 'spend 70k') + span('dim', '         spending a year, k or m suffix ok'));
    println('  ' + span('hi', 'saved 1.2m') + span('dim', '        what you have saved today'));
    println('  ' + span('hi', 'contrib 30k') + span('dim', '       added each year while working'));
    println('  ' + span('hi', 'markets stormy') + span('dim', '     stormy | normal | sun'));
    println('  ' + span('hi', 'show') + span('dim', '              print the whole plan'));
    println('  ' + span('hi', 'help') + span('dim', '              this list'));
    blank();
    println(span('dim', '  numbers take k (thousand) or m (million): 70k, 1.2m, 850000.'));
  }

  /* ---------- commands ---------- */

  function parseNum(raw) {
    if (raw == null) return null;
    var s = String(raw).trim().toLowerCase().replace(/[$,\s]/g, '');
    var m = /^([0-9]*\.?[0-9]+)(k|m)?$/.exec(s);
    if (!m) return null;
    var v = parseFloat(m[1]);
    if (m[2] === 'k') v *= 1000;
    if (m[2] === 'm') v *= 1000000;
    return v;
  }

  var SKY_WORD = { stormy: 'storm', storm: 'storm', normal: 'normal', ordinary: 'normal',
                   sun: 'sun', kind: 'sun', sunny: 'sun' };

  function rerun(label) {
    var res = simulate(state);
    blank();
    println(span('dim', '┌─ ') + span('mut', label));
    printTable(res, state);
    return res;
  }

  var commands = {
    retire: function (args) {
      var v = parseNum(args[0]);
      if (v == null) return 'retire takes an age, like ' + span('hi', 'retire 64');
      var age = Math.round(v);
      if (age < 50 || age > 75) {
        return span('err', 'that age is out of range.') + span('dim', ' try somewhere between 50 and 75.');
      }
      if (age <= state.currentAge) {
        return span('err', 'you’re ' + state.currentAge + ' already.') + span('dim', ' pick an age past that.');
      }
      var before = simulate(state);
      state.retireAge = age;
      var after = simulate(state);
      return 'stopping at ' + span('val', String(age)) + ' instead of ' +
        span('dim', String(before.retireAge)) + ' — lasts until you’re ' +
        span('hi', lastsLabel(after)) + '.';
    },
    spend: function (args) {
      var v = parseNum(args[0]);
      if (v == null) return 'spend takes a number, like ' + span('hi', 'spend 70k');
      var amt = Math.round(v);
      if (amt < 10000 || amt > 400000) {
        return span('err', 'that number looks off.') + span('dim', ' try something between 10k and 400k.');
      }
      var before = simulate(state);
      state.spending = amt;
      var after = simulate(state);
      return 'spending ' + span('val', money(amt)) + ' a year — lasts until you’re ' +
        span('hi', lastsLabel(after)) + '.';
    },
    saved: function (args) {
      var v = parseNum(args[0]);
      if (v == null) return 'saved takes a number, like ' + span('hi', 'saved 1.2m');
      var amt = Math.round(v);
      if (amt < 0 || amt > 20000000) {
        return span('err', 'that number looks off.') + span('dim', ' try something under 20m.');
      }
      state.savings = amt;
      var after = simulate(state);
      return 'starting from ' + span('val', money(amt)) + ' — lasts until you’re ' +
        span('hi', lastsLabel(after)) + '.';
    },
    contrib: function (args) {
      var v = parseNum(args[0]);
      if (v == null) return 'contrib takes a number, like ' + span('hi', 'contrib 30k');
      var amt = Math.round(v);
      if (amt < 0 || amt > 500000) {
        return span('err', 'that number looks off.') + span('dim', ' try something between 0 and 500k.');
      }
      state.contrib = amt;
      var after = simulate(state);
      return 'adding ' + span('val', money(amt)) + ' a year while you work — lasts until you’re ' +
        span('hi', lastsLabel(after)) + '.';
    },
    markets: function (args) {
      var w = (args[0] || '').toLowerCase();
      if (!w) return 'markets takes ' + span('hi', 'stormy') + ', ' + span('hi', 'normal') + ' or ' + span('hi', 'sun');
      var sky = SKY_WORD[w];
      if (!sky) {
        return span('err', 'don’t know that weather.') + span('dim', ' use stormy, normal or sun.');
      }
      state.sky = sky;
      var res = simulate(state);
      return 'markets are ' + span('val', w) + ' — lasts until you’re ' +
        span('hi', lastsLabel(res)) + '.';
    },
    show: function () {
      printState();
      blank();
      printTable(simulate(state), state);
      return null;
    },
    help: function () {
      printHelp();
      return null;
    }
  };
  commands.clear = commands.help; /* harmless alias if someone tries it */

  function runCommand(raw) {
    var trimmed = raw.trim();
    println(span('prompt', 'plan>') + ' ' + span('typed', trimmed));
    if (!trimmed) { scrollToBottom(); return; }

    var parts = trimmed.split(/\s+/);
    var name = parts[0].toLowerCase();
    var args = parts.slice(1);

    if (name === 'clear' || name === 'cls') {
      out.innerHTML = '';
      printBanner();
      println(span('dim', 'cleared.'));
      scrollToBottom();
      return;
    }

    var fn = commands[name];
    if (!fn) {
      println(span('err', 'don’t know “' + name + '”.') + ' ' +
        span('dim', 'type ') + span('hi', 'help') + span('dim', ' for the list of commands.'));
      scrollToBottom();
      return;
    }

    var resp = fn(args);
    if (resp) {
      println('  ' + resp);
      if (name !== 'show' && name !== 'help') {
        var res = simulate(state);
        blank();
        printTable(res, state);
      }
    }
    scrollToBottom();
  }

  /* ---------- wiring ---------- */

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var v = input.value;
      input.value = '';
      runCommand(v);
    }
  });

  document.querySelectorAll('.hint').forEach(function (b) {
    b.addEventListener('click', function () {
      runCommand(b.getAttribute('data-cmd'));
      input.focus();
    });
  });

  printBanner();
  println(span('dim', '  here’s where you stand right now.'));
  printTable(simulate(state), state);
  blank();
  println(span('dim', '  change things and the table rewrites itself. type ') +
    span('hi', 'help') + span('dim', ' for commands.'));
  scrollToBottom();
  input.focus();
})();
</script>
</body>
</html>
