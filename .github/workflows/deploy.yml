name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build        # multi-file site -> dist/ (base /retired/)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Stash the site artifact so the release job can attach it as a zip.
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Enables the Pages site (build_type: workflow) if it isn't already, so the
      # first deploy doesn't 404; harmless once Pages exists. One-time manual
      # alternative: Settings -> Pages -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

  # On a version tag (v*), also build the single-file app and attach both
  # flavours to a GitHub Release for that tag.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:single  # one self-contained HTML file -> dist-single/
      - name: Package single-file app
        run: |
          mkdir release-assets
          cp dist-single/index.html "release-assets/retired-single.html"
      - name: Download site build
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site-dist
      - name: Zip static site
        run: |
          cd site-dist
          zip -qr ../release-assets/retired-site.zip .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
