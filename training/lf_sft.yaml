# LLaMA-Factory full-SFT config for the RE:tired tool-calling fine-tune.
# Replaces the bespoke training/sft/train.py + server.py loop.
#
#   llamafactory-cli train training/lf_sft.yaml
#
# Dataset is registered in training/data/dataset_info.json (retired_train /
# retired_eval). LLaMA-Factory resolves `dataset_dir` relative to the repo it
# runs from, so point it at the converted sharegpt JSON.

### model
model_name_or_path: Qwen/Qwen3-0.6B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
# qwen3_nothink renders <tool_call> natively WITHOUT the empty <think></think>
# the stock qwen3 template injects on every assistant turn — our corpus teaches
# direct tool calls / prose, not reasoning traces, so the think block is waste.
template: qwen3_nothink

### dataset
dataset: retired_train
eval_dataset: retired_eval
dataset_dir: training/data
# With the slimmed tool manifest (6.2k -> 2.1k tokens), full examples run
# p50=2.2k / max=3.2k tokens. 3584 fits every example whole while cutting the
# attention window vs 4096. Packing concatenates these shorter examples into
# the window so the GPU works on real tokens, not padding.
cutoff_len: 3584
packing: true
overwrite_cache: true
# datasets' multiprocess map is fragile on Python 3.14 (dill Pickler) — one
# worker keeps preprocessing in-process where hashing already succeeds.
preprocessing_num_workers: 1

### output
output_dir: training/saves/qwen3-0.6b-sft
logging_steps: 25
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### train — mirrors the v7 bespoke run that was healthy (~3s/it, loss 1.06->0.05)
# With the slim corpus and no gradient checkpointing there's VRAM headroom, so
# raise per-device batch 2->4 (better GPU utilization) and halve accumulation
# to keep the same effective batch of 32.
per_device_train_batch_size: 4
gradient_accumulation_steps: 8         # effective batch 32
learning_rate: 5.0e-6
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_steps: 100
weight_decay: 0.1
bf16: true
# Disabled: with the slim manifest (max ~3.2k tokens) activation memory is
# small and the card has 24GB — checkpointing only recomputed activations for
# ~35% extra compute and was a major reason the GPU sat at 21% power draw.
gradient_checkpointing: false

### eval
val_size: 0                            # eval split comes pre-separated as retired_eval
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 500
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
